plugins {
    id 'fabric-loom'
}

version = '1.0.0-beta.3'
group = rootProject.maven_group
base { archivesName = 'aresafio-menu-client' }

repositories { mavenCentral() }

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings "net.fabricmc:yarn:${rootProject.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.register('verifyMenuLayout', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'pe.studios.aresafio.menu.MenuLayoutTest'
    args rootProject.file('ARESAFIO_GUI_MenuBeta_ResourcePack.zip').absolutePath
}
check.dependsOn verifyMenuLayout

tasks.register('betaDistribution', Zip) {
    dependsOn remapJar, verifyMenuLayout
    archiveFileName = 'ARESAFIO_MenuBeta3_1.21.1.zip'
    destinationDirectory = rootProject.layout.buildDirectory.dir('distributions')
    from(tasks.named('remapJar').flatMap { it.archiveFile }) { into 'mods' }
    from(rootProject.file('ARESAFIO_GUI_MenuBeta_ResourcePack.zip')) { into 'resourcepacks' }
    from('INSTALAR.txt')
}
